pool:
  vmImage: windows-latest

trigger:
  paths:
    include:
    # Only trigger on update of `current.zip`
    - current.zip

resources:
  repositories:
    - repository: dumped-cs
      type: github
      endpoint: RaenonX-PokemonSleep
      name: RaenonX-PokemonSleep/pokemon-sleep-dumped-cs
    - repository: dumped-api-typing
      type: github
      endpoint: RaenonX-PokemonSleep
      name: RaenonX-PokemonSleep/pokemon-sleep-dumped-api-typing

variables:
  - template: variables/main.yml

stages:
- stage: DumpCS
  displayName: Dump C#
  jobs:
    - job: DumpCS
      displayName: Dump C#
      steps:
        - template: templates/setup.yml

        - task: UsePythonVersion@0
          displayName: Select Python for DB extraction
          inputs:
            versionSpec: '$(DB_INFO_PYTHON_VERSION)'
            architecture: x64
            addToPath: true

        - task: Cache@2
          displayName: Cache pip downloads
          inputs:
            key: '"db-info-pip" | "$(Agent.OS)" | "$(DB_INFO_PYTHON_VERSION)" | $(REPO_APK_DUMPER_ABS_DIR)/.tool/db_info/requirements.txt'
            restoreKeys: |
              "db-info-pip" | "$(Agent.OS)" | "$(DB_INFO_PYTHON_VERSION)"
            path: $(PIP_CACHE_DIR)

        - pwsh: |
            python -m pip install -r .tool/db_info/requirements.txt
          displayName: Install DB extractor dependencies
          workingDirectory: $(REPO_APK_DUMPER_ABS_DIR)
          env:
            PIP_CACHE_DIR: $(PIP_CACHE_DIR)

        - task: ExtractFiles@1
          displayName: 'Extract Binary ZIP'
          inputs:
            archiveFilePatterns: $(REPO_APK_DUMPER_ABS_DIR)/current.zip
            destinationFolder: $(REPO_APK_DUMPER_ABS_DIR)
            cleanDestinationFolder: false

        - powershell: |
            Get-FileHash .\libil2cpp.so -Algorithm MD5
            Get-FileHash .\global-metadata.dat -Algorithm MD5
          displayName: 'Print File Hash'
          workingDirectory: $(REPO_APK_DUMPER_ABS_DIR)

        - powershell: |
            $unityVersion = (Get-Content .\current-version-unity.txt -Raw).Trim()

            .\.tool\Cpp2IL-d526068.exe `
              --force-binary-path .\libil2cpp.so `
              --force-metadata-path .\global-metadata.dat `
              --force-unity-version $unityVersion `
              --output-as diffable-cs `
              --output-to "$(CPP_DUMP_OUTPUT_DIR)"
          displayName: 'Dump C# files'
          workingDirectory: $(REPO_APK_DUMPER_ABS_DIR)

        - pwsh: |
            python .tool/db_info/main.py `
              --binary libil2cpp.so `
              --metadata global-metadata.dat `
              --version-file current-version.txt `
              --unity-version-file current-version-unity.txt `
              --cpp2il .tool/Cpp2IL-d526068.exe `
              --cs-dir "$(CPP_DUMP_OUTPUT_DIR)/DiffableCs/PSMain" `
              --work-dir "$(Agent.TempDirectory)/db-info-work" `
              --legacy-info "$(REPO_DUMPED_CS_ABS_DIR)/DbMetadataParsedInfo.json" `
              --output "$(DB_INFO_OUTPUT_PATH)"
          displayName: Extract and merge DB information
          workingDirectory: $(REPO_APK_DUMPER_ABS_DIR)

        - powershell: |
            Copy-Item `
              -Path "$(CPP_DUMP_OUTPUT_DIR)\DiffableCs\PSMain\*" `
              -Destination "$(DUMPED_CS_DIR)" `
              -Force `
              -Recurse
          displayName: 'Copy dumped C# files'
          workingDirectory: $(REPO_APK_DUMPER_ABS_DIR)

        - task: PowerShell@2
          displayName: Cleanup Dump Metadata
          inputs:
            filePath: '$(REPO_APK_DUMPER_ABS_DIR)\.tool\Cleanup-Meta.ps1'
            arguments: '-CsFileDir $(DUMPED_CS_DIR)'
            showWarnings: true
            pwsh: true

        - task: PowerShell@2
          displayName: Sort Asset Addresses
          inputs:
            filePath: '$(REPO_APK_DUMPER_ABS_DIR)\.tool\Sort-Asset-Addresses.ps1'
            arguments: '-AddressableAssetsPath $(ASSET_ADDRESSES_SOURCE_PATH) -OutputPath $(ASSET_ADDRESSES_OUTPUT_PATH)'
            showWarnings: true
            pwsh: true

        - task: PowerShell@2
          displayName: Commit Dump Changes
          inputs:
            targetType: 'inline'
            script: |
              $Version = (Get-Content -Path "$(REPO_APK_DUMPER_ABS_DIR)\current-version.txt" -Raw).Trim()
              git checkout main
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              git add .
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              git diff --cached --quiet --exit-code
              $diffExitCode = $LASTEXITCODE
              if ($diffExitCode -eq 0) {
                Write-Host "No changes to commit."
                exit 0
              }
              if ($diffExitCode -ne 1) { exit $diffExitCode }
              $commitMessagePath = Join-Path "$(Agent.TempDirectory)" 'dump-commit-message.txt'
              @("update: $Version", '', '$(Build.Repository.Name)@$(Build.SourceVersion)') |
                Set-Content -LiteralPath $commitMessagePath -Encoding utf8
              git commit --file $commitMessagePath
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              git push origin main
            showWarnings: true
            workingDirectory: $(REPO_DUMPED_CS_ABS_DIR)
            pwsh: true

- stage: DumpApiTyping
  displayName: Dump API Typing
  dependsOn: DumpCS
  jobs:
    - job: DumpApiTyping
      displayName: Dump API Typing
      steps:
        - checkout: self
          displayName: Checkout Dumper Repo
          path: $(REPO_APK_DUMPER_DIR)

        - checkout: dumped-cs
          displayName: Checkout Dumped C# Repo
          path: $(REPO_DUMPED_CS_DIR)

        - checkout: dumped-api-typing
          displayName: Checkout API Typing Repo
          persistCredentials: true
          fetchDepth: 0
          path: $(REPO_API_TYPING_DIR)

        - script: |
            git config --global user.email "raenonx0710@gmail.com"
            git config --global user.name "RaenonX (API Typing Dump)"
            git config --global core.autocrlf false
          displayName: Configure Git
          workingDirectory: $(REPO_API_TYPING_ABS_DIR)

        - powershell: |
            & "$(REPO_APK_DUMPER_ABS_DIR)\.tool\PsApiAnalyzer-1dd6e24.exe" `
              -input "$(DUMPED_CS_DIR)" `
              -output "$(REPO_API_TYPING_ABS_DIR)"
          displayName: 'Dump API Typing'
          workingDirectory: $(REPO_APK_DUMPER_ABS_DIR)

        - task: PowerShell@2
          displayName: Commit API Typing Changes
          inputs:
            targetType: 'inline'
            script: |
              $Version = (Get-Content -Path "$(REPO_APK_DUMPER_ABS_DIR)\current-version.txt" -Raw).Trim()
              git checkout main
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              git add .
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              git diff --cached --quiet --exit-code
              $diffExitCode = $LASTEXITCODE
              if ($diffExitCode -eq 0) {
                Write-Host "No changes to commit."
                exit 0
              }
              if ($diffExitCode -ne 1) { exit $diffExitCode }
              $commitMessagePath = Join-Path "$(Agent.TempDirectory)" 'api-typing-commit-message.txt'
              @("update: $Version", '', '$(Build.Repository.Name)@$(Build.SourceVersion)') |
                Set-Content -LiteralPath $commitMessagePath -Encoding utf8
              git commit --file $commitMessagePath
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              git push origin main
            showWarnings: true
            workingDirectory: $(REPO_API_TYPING_ABS_DIR)
            pwsh: true
